[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startretries=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:hexo]
command=/app/node_modules/.bin/hexo server -s -i 127.0.0.1 -p 4000
directory=/app
user=node
environment=HOME="/app",NODE_ENV="production"
autorestart=true
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:artalk]
command=/opt/artalk server -c /data/artalk.yml
directory=/data
user=node
environment=HOME="/data"
autorestart=true
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ttyd]
command=/usr/local/bin/ttyd -W -i 127.0.0.1 -p 7681 /bin/bash -l
directory=/app
user=node
environment=HOME="/app",TERM="xterm-256color"
autorestart=true
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /data/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
directory=/data
user=node
environment=HOME="/data",MINIO_ROOT_USER="%(ENV_MINIO_ROOT_USER)s",MINIO_ROOT_PASSWORD="%(ENV_MINIO_ROOT_PASSWORD)s"
autorestart=true
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Regenerates the static site on a 60s loop — admin saves ride in within a minute
# (works even though Railway volumes don't emit inotify events for hexo's watcher)
[program:regenerate]
command=/bin/sh -c "while true; do /app/node_modules/.bin/hexo generate >/tmp/hexo-regen.log 2>&1; sleep 60; done"
directory=/app
user=node
environment=HOME="/app",NODE_ENV="production"
autorestart=true
startretries=10
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0