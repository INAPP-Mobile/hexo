[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startretries=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:hexo]
command=/app/node_modules/.bin/hexo server -s -i 127.0.0.1 -p 4000
directory=/app
user=node
environment=HOME="/app",NODE_ENV="production"
autorestart=true
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ttyd]
command=/usr/local/bin/start-ttyd.sh
directory=/app
user=node
environment=HOME="/app",TERM="xterm-256color"
autorestart=true
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Regenerates the static site on a 60s loop — admin saves ride in within a minute
[program:regenerate]
command=/bin/bash -c "while true; do sleep 60; cd /app && /app/node_modules/.bin/hexo generate; done"
directory=/app
user=node
environment=HOME="/app",NODE_ENV="production"
autorestart=true
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0