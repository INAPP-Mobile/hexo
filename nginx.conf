# Hexo blog platform router — one public URL, five upstreams:
#   /           -> static blog  (nginx serves /app/public directly)
#   /admin/     -> hexo-admin   (hexo server, 127.0.0.1:4000)
#   /comment/   -> Artalk API + dashboard + uploaded images (127.0.0.1:23366)
#   /terminal/  -> ttyd web terminal (127.0.0.1:7681)
#   /minio/     -> MinIO S3 API, path-style (127.0.0.1:9000)

server {
    listen 80 default_server;
    server_name _;
    root /data/public;
    index index.html;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # ---- Static blog (generated site lives on the /app/public volume) ----
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- hexo-admin (authoring UI) ----
    location /admin/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Artalk comments (API, dashboard at /comment/admin/, images) ----
    location /comment/ {
        proxy_pass http://127.0.0.1:23366/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- ttyd web terminal (WebSocket upgrade) ----
    location /terminal/ {
        proxy_pass http://127.0.0.1:7681/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ---- MinIO S3 API (path-style: /minio/<bucket>/<key>) ----
    location /minio/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- MinIO web console (proxy assets too) ----
    location /minio-console/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}