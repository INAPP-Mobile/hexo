# Hexo blog platform router — one public URL, three upstreams:
#   /           -> static blog  (nginx serves /data/public directly)
#   /admin/     -> hexo-admin   (hexo server, 127.0.0.1:4000)
#   /terminal/  -> ttyd web terminal (127.0.0.1:7681)

server {
    listen 80 default_server;
    server_name _;
    root /data/public;
    index index.html;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # ---- Static blog (generated site lives on the /data/public volume) ----
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- hexo-admin (authoring UI) ----
    location /admin/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- ttyd web terminal (WebSocket upgrade, HTTP Basic Auth) ----
    location /terminal/ {
        auth_basic "Hexo terminal";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:7681/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}